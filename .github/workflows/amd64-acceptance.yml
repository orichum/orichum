name: Native AMD64 acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amd64-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Linux AMD64 acceptance
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Prepare native runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          sudo npm install --global @anthropic-ai/claude-code
          export ORICHUM_HOME="$RUNNER_TEMP/orichum-home"
          export ORICHUM_DATA_HOME="$ORICHUM_HOME"
          export ORICHUM_CONFIG_HOME="$ORICHUM_HOME/config"
          export USER_BIN_DIR="$RUNNER_TEMP/orichum-bin"
          export UV_TOOL_DIR="$RUNNER_TEMP/uv-tools"
          export UV_TOOL_BIN_DIR="$RUNNER_TEMP/orichum-bin"
          printf '%s\n' \
            "ORICHUM_HOME=$ORICHUM_HOME" \
            "ORICHUM_DATA_HOME=$ORICHUM_DATA_HOME" \
            "ORICHUM_CONFIG_HOME=$ORICHUM_CONFIG_HOME" \
            "USER_BIN_DIR=$USER_BIN_DIR" \
            "UV_TOOL_DIR=$UV_TOOL_DIR" \
            "UV_TOOL_BIN_DIR=$UV_TOOL_BIN_DIR" >>"$GITHUB_ENV"
          printf '%s\n' "$USER_BIN_DIR" >>"$GITHUB_PATH"
          runtime_dir="/run/user/$(id -u)"
          printf 'XDG_RUNTIME_DIR=%s\n' "$runtime_dir" >>"$GITHUB_ENV"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          XDG_RUNTIME_DIR="$runtime_dir" systemctl --user show-environment >/dev/null
          claude --version
          uv --version

      - name: Run repository test suites
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py'
          for test_script in \
              tests/test_smoke.sh \
              tests/test_plugins.sh \
              tests/test_installer.sh \
              tests/test_install_transaction.sh \
              tests/test_live_stack_routes.sh \
              tests/test_orichum_launcher.sh \
              tests/test_orichum_completion.sh \
              tests/test_uninstall.sh; do
            if ! bash "$test_script"; then
              printf '::error title=Shell contract failed::%s failed; diagnostic rerun follows\n' \
                "$test_script"
              bash -x "$test_script"
              exit 1
            fi
          done

      - name: Fresh install without providers
        shell: bash
        run: |
          set -euo pipefail
          report_acceptance_failure() {
            local status="$?"
            printf '::error title=Native acceptance failure::line %s exited %s: %s\n' \
              "${BASH_LINENO[0]:-$LINENO}" "$status" "$BASH_COMMAND"
            exit "$status"
          }
          trap report_acceptance_failure ERR
          ./install.sh | tee "$RUNNER_TEMP/orichum-fresh.log"
          grep -Fxq 'Orichum is installed.' \
            "$RUNNER_TEMP/orichum-fresh.log"
          grep -Fxq 'Next: orichum setup' \
            "$RUNNER_TEMP/orichum-fresh.log"
          if grep -Eq 'COMPONENT|127\.0\.0\.1|Runtime release:' \
              "$RUNNER_TEMP/orichum-fresh.log"; then
            exit 1
          fi
          fresh_install_log="$(
            find "$ORICHUM_DATA_HOME/logs" -type f -name 'install.*.log' |
              sort | tail -1
          )"
          test -n "$fresh_install_log"
          test "$(stat -c %a "$ORICHUM_DATA_HOME/logs")" = 700
          test "$(stat -c %a "$fresh_install_log")" = 600
          managed_python="$ORICHUM_DATA_HOME/bin/orichum-python"
          test -x "$managed_python"
          test -x "$ORICHUM_DATA_HOME/bin/lean-ctx"
          source ./lib/workflow.sh
          leanctx_ort_dylib_path="$(
            verified_leanctx_ort_dylib_path \
              "$ORICHUM_DATA_HOME/bin/lean-ctx" \
              "$ORICHUM_DATA_HOME" "$RUNNER_TEMP"
          )"
          probe_leanctx_capabilities \
            "$ORICHUM_DATA_HOME/bin/lean-ctx" "$managed_python" \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP" \
            "$leanctx_ort_dylib_path" \
            "$ORICHUM_DATA_HOME/leanctx/cache"
          "$managed_python" -I -B -c '
          import platform, sys
          assert platform.python_implementation() == "CPython"
          assert sys.version_info[:2] == (3, 14)
          '
          jq -e '
            keys == ["claudexProxyPort", "cliproxyPort", "leanctxProxyPort", "routeProxyPort"] and
            ([.[]] | unique | length) == 4
          ' "$ORICHUM_DATA_HOME/service-ports.json" >/dev/null
          test "$(systemctl --user is-active orichum-cliproxy.service)" = active
          test "$(systemctl --user is-active orichum-route-proxy.service 2>/dev/null || true)" = inactive
          jq -e '
            .schemaVersion == 1 and
            (.components.routing | not)
          ' "$ORICHUM_DATA_HOME/state/install-state.json" >/dev/null
          curl -fsS "http://127.0.0.1:$(jq -r .cliproxyPort "$ORICHUM_DATA_HOME/service-ports.json")/v1/models" |
            jq -e '.data | type == "array"' >/dev/null
          trap - ERR
          set +e
          poison_bin="$RUNNER_TEMP/poison-python"
          mkdir -p "$poison_bin"
          printf '#!/bin/sh\nexit 99\n' >"$poison_bin/python3"
          chmod +x "$poison_bin/python3"
          doctor_output="$(
            PATH="$poison_bin:$USER_BIN_DIR:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
              orichum doctor 2>&1
          )"
          doctor_rc=$?
          set -e
          trap report_acceptance_failure ERR
          printf '%s\n' "$doctor_output"
          test "$doctor_rc" -eq 1
          test "$(grep -c '^FAIL ' <<<"$doctor_output")" -eq 1
          grep -Fq 'provider setup is pending; run orichum setup' \
            <<<"$doctor_output"

      - name: Activate disposable multi-family routes
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - "$ORICHUM_DATA_HOME/auth" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          auth = Path(sys.argv[1])
          auth.mkdir(mode=0o700, parents=True, exist_ok=True)
          for name, provider in (
              ("codex-amd64.json", "codex"),
              ("claude-amd64.json", "claude"),
          ):
              target = auth / name
              target.write_text(
                  json.dumps(
                      {
                          "type": provider,
                          "email": "amd64-acceptance@example.invalid",
                          "access_token": "acceptance-placeholder-not-a-secret",
                          "refresh_token": "acceptance-placeholder-not-a-secret",
                          "disabled": False,
                      }
                  ),
                  encoding="utf-8",
              )
              os.chmod(target, 0o600)
          PY
          orichum provider account add \
            "AMD64 GPT" openai codex-amd64.json shared --priority primary
          orichum provider account add \
            "AMD64 Claude" anthropic claude-amd64.json shared --priority primary
          ./install.sh
          jq -e '
            keys == ["claudexProxyPort", "cliproxyPort", "leanctxProxyPort", "routeProxyPort"] and
            ([.[]] | unique | length) == 4
          ' "$ORICHUM_DATA_HOME/service-ports.json" >/dev/null
          for unit in \
              orichum-cliproxy.service \
              orichum-route-proxy.service; do
            test "$(systemctl --user is-enabled "$unit")" = enabled
            test "$(systemctl --user is-active "$unit")" = active
          done
          systemctl --user show orichum-route-proxy.service \
            --property=ExecStart --value |
            rg -Fq "$ORICHUM_DATA_HOME/bin/orichum-python"
          route_port="$(jq -r .routeProxyPort "$ORICHUM_DATA_HOME/service-ports.json")"
          curl -fsS "http://127.0.0.1:$route_port/health" |
            jq -e '
              .service == "orichum-route-proxy" and .ready == true
            ' >/dev/null
          curl -fsS "http://127.0.0.1:$route_port/v1/models" |
            jq -e '
              [.data[].id] as $ids |
              ($ids | index("gpt-5.6-sol")) != null and
              ($ids | index("gpt-5.6-terra")) != null and
              ($ids | index("claude-sonnet-5")) != null and
              ($ids | index("claude-opus-5")) != null
            ' >/dev/null
          orichum doctor

      - name: Verify LeanCTX code-intelligence contract
        shell: bash
        run: |
          set -euo pipefail
          source lib/workflow.sh
          leanctx_ort_dylib_path="$(
            verified_leanctx_ort_dylib_path \
              "$ORICHUM_DATA_HOME/bin/lean-ctx" \
              "$ORICHUM_DATA_HOME" "$RUNNER_TEMP"
          )"
          probe_leanctx_capabilities \
            "$ORICHUM_DATA_HOME/bin/lean-ctx" \
            "$ORICHUM_DATA_HOME/bin/orichum-python" \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP" \
            "$leanctx_ort_dylib_path" \
            "$ORICHUM_DATA_HOME/leanctx/cache"

      - name: Verify fast repeat and explicit upgrade
        shell: bash
        run: |
          set -euo pipefail
          before_ports="$(jq -cS . "$ORICHUM_DATA_HOME/service-ports.json")"
          before_route_pid="$(
            systemctl --user show orichum-route-proxy.service \
              --property=MainPID --value
          )"
          before_python_target="$(readlink "$ORICHUM_DATA_HOME/bin/orichum-python")"
          repeat_started="$(python3 -c 'import time; print(time.monotonic_ns())')"
          ./install.sh | tee "$RUNNER_TEMP/orichum-fast.log"
          repeat_finished="$(python3 -c 'import time; print(time.monotonic_ns())')"
          repeat_ms="$(( (repeat_finished - repeat_started) / 1000000 ))"
          test "$repeat_ms" -lt 15000
          after_ports="$(jq -cS . "$ORICHUM_DATA_HOME/service-ports.json")"
          test "$before_ports" = "$after_ports"
          test "$before_route_pid" = "$(
            systemctl --user show orichum-route-proxy.service \
              --property=MainPID --value
          )"
          test "$before_python_target" = "$(
            readlink "$ORICHUM_DATA_HOME/bin/orichum-python"
          )"
          grep -Fxq 'Orichum is ready.' \
            "$RUNNER_TEMP/orichum-fast.log"
          if grep -Eq 'COMPONENT|127\.0\.0\.1|Runtime release:' \
              "$RUNNER_TEMP/orichum-fast.log"; then
            exit 1
          fi
          ./install.sh --upgrade --verbose | \
            tee "$RUNNER_TEMP/orichum-upgrade.log"
          for component in \
              Python CLIProxyAPI Claudex LeanCTX Routing; do
            grep -Eq \
              "^${component}[[:space:]]+upgraded[[:space:]]*$" \
              "$RUNNER_TEMP/orichum-upgrade.log"
          done
          grep -Eq \
            '^Controller plugin[[:space:]]+upgraded[[:space:]]*$' \
            "$RUNNER_TEMP/orichum-upgrade.log"
          grep -Fq 'Running Orichum doctor' \
            "$RUNNER_TEMP/orichum-upgrade.log"
          source lib/workflow.sh
          leanctx_ort_dylib_path="$(
            verified_leanctx_ort_dylib_path \
              "$ORICHUM_DATA_HOME/bin/lean-ctx" \
              "$ORICHUM_DATA_HOME" "$RUNNER_TEMP"
          )"
          probe_leanctx_capabilities \
            "$ORICHUM_DATA_HOME/bin/lean-ctx" \
            "$ORICHUM_DATA_HOME/bin/orichum-python" \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP" \
            "$leanctx_ort_dylib_path" \
            "$ORICHUM_DATA_HOME/leanctx/cache"

      - name: Verify guided setup and resumability
        shell: bash
        run: |
          set -euo pipefail
          printf -v setup_command 'orichum setup %q' "$GITHUB_WORKSPACE"
          script --quiet --return --command "$setup_command" \
            "$RUNNER_TEMP/orichum-setup-first.log"
          script --quiet --return --command "$setup_command" \
            "$RUNNER_TEMP/orichum-setup-repeat.log"
          grep -Fq 'Orichum is ready.' \
            "$RUNNER_TEMP/orichum-setup-first.log"
          grep -Fq '✓ Already configured' \
            "$RUNNER_TEMP/orichum-setup-repeat.log"
          if grep -Eq '127\.0\.0\.1|Runtime release:|\.service' \
              "$RUNNER_TEMP/orichum-setup-repeat.log"; then
            exit 1
          fi
          printf -v verbose_setup 'orichum setup --verbose %q' \
            "$GITHUB_WORKSPACE"
          script --quiet --return --command "$verbose_setup" \
            "$RUNNER_TEMP/orichum-setup-verbose.log"
          grep -Fq 'Orichum local components are ready.' \
            "$RUNNER_TEMP/orichum-setup-verbose.log"
          setup_log="$(
            find "$ORICHUM_DATA_HOME/logs" -type f -name 'setup-*.log' |
              sort | tail -1
          )"
          test -n "$setup_log"
          test "$(stat -c %a "$setup_log")" = 600
          jq -e '(.accounts | length) == 2' \
            "$ORICHUM_CONFIG_HOME/accounts.json" >/dev/null
          jq --arg root "$GITHUB_WORKSPACE" -e '
            (.contexts | length) == 1 and
            .contexts[0].root == $root and
            .contexts[0].accountPools == ["shared"]
          ' "$ORICHUM_CONFIG_HOME/projects.json" >/dev/null
          printf -v configure_command \
            'orichum configure --project %q' "$GITHUB_WORKSPACE"
          printf '5\n' | script --quiet --return \
            --command "$configure_command" \
            "$RUNNER_TEMP/orichum-configure.log"
          grep -Fq 'Orichum configuration' \
            "$RUNNER_TEMP/orichum-configure.log"
          grep -Fq '1. Models' \
            "$RUNNER_TEMP/orichum-configure.log"
          if grep -Eq 'oc-[acr]-[0-9a-f]{16}|credentialRef|127\.0\.0\.1' \
              "$RUNNER_TEMP/orichum-configure.log"; then
            exit 1
          fi
          orichum doctor

      - name: Verify uninstall lifecycle
        shell: bash
        run: |
          set -euo pipefail
          printf 'preserve\n' >"$ORICHUM_DATA_HOME/auth/uninstall-sentinel"
          printf 'preserve\n' >"$ORICHUM_CONFIG_HOME/uninstall-sentinel"
          ./install.sh --uninstall
          test "$(systemctl --user is-active orichum-cliproxy.service 2>/dev/null || true)" != active
          test "$(systemctl --user is-active orichum-route-proxy.service 2>/dev/null || true)" != active
          test ! -e "$HOME/.config/systemd/user/orichum-cliproxy.service"
          test ! -e "$HOME/.config/systemd/user/orichum-route-proxy.service"
          test ! -e "$USER_BIN_DIR/orichum"
          test ! -e "$ORICHUM_DATA_HOME/bin"
          test ! -e "$ORICHUM_DATA_HOME/python"
          test ! -e "$ORICHUM_DATA_HOME/tools"
          test -f "$ORICHUM_DATA_HOME/auth/uninstall-sentinel"
          test -f "$ORICHUM_CONFIG_HOME/uninstall-sentinel"
          ./install.sh --uninstall --purge
          test ! -e "$ORICHUM_DATA_HOME"
          test ! -e "$ORICHUM_CONFIG_HOME"
          test -d "$GITHUB_WORKSPACE"

      - name: Print bounded diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          for unit in \
              orichum-cliproxy.service \
              orichum-route-proxy.service; do
            systemctl --user status "$unit" --no-pager
            journalctl --user -u "$unit" --no-pager -n 80
          done
          ports_file="$ORICHUM_DATA_HOME/service-ports.json"
          if [[ -f "$ports_file" ]]; then
            jq '{
              preferredClaudexProxyPort: .claudexProxyPort,
              cliproxyPort,
              leanctxProxyPort,
              routeProxyPort
            }' "$ports_file"
            for field_and_path in \
                'cliproxyPort /v1/models' \
                'routeProxyPort /v1/models'; do
              read -r field endpoint <<<"$field_and_path"
              port="$(jq -r --arg field "$field" '.[$field]' "$ports_file")"
              curl -fsS --max-time 3 "http://127.0.0.1:$port$endpoint" |
                jq '{service, status, ready, object, modelCount: (.data | length)}'
            done
          fi
          exit 0

      - name: Exercise WSL-compatible user-service contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="orichum-systemd-acceptance:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="orichum-systemd-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            status="$?"
            if [[ "$status" -ne 0 ]] && docker inspect "$container" >/dev/null 2>&1; then
              docker exec "$container" journalctl --no-pager -n 120 || true
            fi
            docker rm --force "$container" >/dev/null 2>&1 || true
            docker image rm "$image" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          docker build --tag "$image" - <<'DOCKERFILE'
          FROM ubuntu:24.04
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update \
              && apt-get install --yes --no-install-recommends \
                ca-certificates curl dbus-user-session gh git iproute2 jq python3 \
                ripgrep sudo systemd systemd-sysv tar util-linux xz-utils \
              && curl -fsSL https://deb.nodesource.com/setup_22.x | bash - \
              && apt-get install --yes --no-install-recommends nodejs \
              && npm install --global @anthropic-ai/claude-code \
              && apt-get clean \
              && rm -rf /var/lib/apt/lists/*
          STOPSIGNAL SIGRTMIN+3
          CMD ["/sbin/init"]
          DOCKERFILE
          docker run --detach \
            --name "$container" \
            --privileged \
            --cgroupns=host \
            --tmpfs /run \
            --tmpfs /run/lock \
            --volume /sys/fs/cgroup:/sys/fs/cgroup:rw \
            "$image" >/dev/null
          for _ in {1..60}; do
            system_state="$(
              docker exec "$container" systemctl is-system-running \
                2>/dev/null || true
            )"
            if [[ "$system_state" == running || "$system_state" == degraded ]]; then
              break
            fi
            sleep 1
          done
          [[ "$system_state" == running || "$system_state" == degraded ]]
          docker exec "$container" useradd --create-home --shell /bin/bash orichum
          docker cp . "$container:/home/orichum/workspace"
          docker exec "$container" \
            chown --recursive orichum:orichum /home/orichum/workspace
          docker exec "$container" loginctl enable-linger orichum
          uid="$(docker exec "$container" id -u orichum)"
          docker exec "$container" systemctl start "user@$uid.service"
          docker exec \
            --user orichum \
            --env HOME=/home/orichum \
            --env XDG_RUNTIME_DIR="/run/user/$uid" \
            --env DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" \
            "$container" systemctl --user show-environment >/dev/null
          docker exec \
            --user orichum \
            --env HOME=/home/orichum \
            "$container" \
            bash -lc 'curl -LsSf https://astral.sh/uv/install.sh | sh'
          docker exec \
            --user orichum \
            --env HOME=/home/orichum \
            --env XDG_RUNTIME_DIR="/run/user/$uid" \
            --env DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" \
            --env GH_TOKEN="$GH_TOKEN" \
            --env ORICHUM_HOME=/home/orichum/.orichum \
            --env ORICHUM_DATA_HOME=/home/orichum/.orichum \
            --env ORICHUM_CONFIG_HOME=/home/orichum/.orichum/config \
            --env USER_BIN_DIR=/home/orichum/orichum-bin \
            --env PATH=/home/orichum/orichum-bin:/home/orichum/.local/bin:/usr/local/bin:/usr/bin:/bin \
            "$container" \
            bash -lc '
              set -euo pipefail
              cd /home/orichum/workspace
              ./install.sh | tee /tmp/orichum-install-normal.log
              grep -Fxq "Orichum is installed." \
                /tmp/orichum-install-normal.log
              grep -Fxq "Next: orichum setup" \
                /tmp/orichum-install-normal.log
              if grep -Eq "COMPONENT|127\\.0\\.0\\.1|Runtime release:" \
                  /tmp/orichum-install-normal.log; then
                exit 1
              fi
              install_log="$(
                find "$ORICHUM_DATA_HOME/logs" -type f \
                  -name "install.*.log" | sort | tail -1
              )"
              test -n "$install_log"
              test "$(stat -c %a "$ORICHUM_DATA_HOME/logs")" = 700
              test "$(stat -c %a "$install_log")" = 600
              jq -e '\''
                keys == [
                  "claudexProxyPort",
                  "cliproxyPort",
                  "leanctxProxyPort",
                  "routeProxyPort"
                ] and
                ([.[]] | unique | length) == 4
              '\'' "$ORICHUM_DATA_HOME/service-ports.json" >/dev/null
              test "$(systemctl --user is-enabled orichum-cliproxy.service)" = enabled
              test "$(systemctl --user is-active orichum-cliproxy.service)" = active
              test "$(systemctl --user is-active orichum-route-proxy.service 2>/dev/null || true)" = inactive
              ./install.sh --verbose | tee /tmp/orichum-install-verbose.log
              grep -Eq "^CLIProxyAPI[[:space:]]+reused[[:space:]]*$" \
                /tmp/orichum-install-verbose.log
              test "$(systemctl --user is-active orichum-route-proxy.service 2>/dev/null || true)" = inactive
              ./install.sh --uninstall --purge
              test "$(systemctl --user is-active orichum-cliproxy.service 2>/dev/null || true)" != active
              test ! -e "$HOME/.config/systemd/user/orichum-cliproxy.service"
              test ! -e "$HOME/.config/systemd/user/orichum-route-proxy.service"
              test ! -e "$USER_BIN_DIR/orichum"
              test ! -e "$ORICHUM_DATA_HOME"
              test ! -e "$ORICHUM_CONFIG_HOME"
              test -d /home/orichum/workspace
            '
