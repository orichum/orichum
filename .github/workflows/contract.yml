name: Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Fast contract
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install contract dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Runner mirrors may reject HTTP; use HTTPS for package downloads.
          sudo find /etc/apt -type f \
            \( -name '*.list' -o -name '*.sources' -o -name '*mirrors.txt' \) \
            -exec sed -i 's|http://|https://|g' {} +
          sudo apt-get update
          sudo apt-get install --yes jq ripgrep

      - name: Verify release boundaries
        shell: bash
        run: |
          set -euo pipefail
          uvx --from ruff==0.16.1 ruff format --check \
            integrations/common/model_context.py \
            tests/test_model_context.py \
            tests/test_context_soak_native.py \
            integrations/common/context_control.py \
            tests/test_context_control.py \
            tests/test_context_native.py \
            integrations/common/terminal_ui.py \
            integrations/common/configure_state.py \
            integrations/common/configure_wizard.py \
            integrations/common/project_models.py \
            integrations/common/jira_profiles.py \
            tests/test_terminal_ui.py \
            tests/test_configure_state.py \
            tests/test_project_models.py \
            tests/test_jira_profiles.py \
            tests/test_configure_wizard.py
          uvx --from ruff==0.16.1 ruff check \
            integrations/common/model_context.py \
            tests/test_model_context.py \
            tests/test_context_soak_native.py \
            integrations/common/context_control.py \
            tests/test_context_control.py \
            tests/test_context_native.py \
            integrations/common/terminal_ui.py \
            integrations/common/configure_state.py \
            integrations/common/configure_wizard.py \
            integrations/common/project_models.py \
            integrations/common/jira_profiles.py \
            integrations/common/atlassian_mcp.py \
            integrations/common/orichum_cli.py \
            tests/test_terminal_ui.py \
            tests/test_configure_state.py \
            tests/test_configure_wizard.py \
            tests/test_project_models.py \
            tests/test_jira_profiles.py \
            tests/test_atlassian_mcp.py \
            tests/test_orichum_cli.py \
            tests/test_orichum_completion.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          bash tests/test_smoke.sh
          bash tests/test_bootstrap.sh

      - name: Verify native context hook contract without provider credentials
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/native-claude" --no-audit --no-fund \
            @anthropic-ai/claude-code
          ORICHUM_NATIVE_CLAUDE="$RUNNER_TEMP/native-claude/node_modules/.bin/claude" \
            uv run --no-project --python 3.14 python -m unittest \
              tests.test_context_native tests.test_context_soak_native
